# One web service + one Postgres. Deploy with: Render dashboard > New > Blueprint > pick this repo.
# The web service must be an always-on paid instance: free instances sleep, and a sleeping
# service cannot run the in-process follow-up scheduler or receive webhooks reliably.
services:
  - type: web
    name: meganet-lead-sentinel
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # ONE worker on purpose: the scheduler runs inside the process. More workers = duplicate follow-ups.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: meganet-sentinel-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Secrets below are entered once in the Render dashboard (sync: false = not stored in this file).
      - key: DASHBOARD_PASSWORD
        sync: false
      # Model for classification and drafting. Must be a model your key can use; plain-text requests only.
      - key: ANTHROPIC_MODEL
        value: claude-haiku-5-5
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: OWNER_WHATSAPP_NUMBER
        sync: false
      # Testing only: set to 1 to let your own (owner) number create a lead. Leave 0 in normal use.
      - key: OWNER_AS_LEAD
        value: "0"
      # Waiting prospects: holding-reply cooldown and owner reminder timing
      - key: HOLD_REPLY_COOLDOWN_HOURS
        value: "4"
      - key: OWNER_REPLY_REMINDER_MINUTES
        value: "60"
      # Optional email copy of owner alerts: set ALL six or none (blank = email off)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
      - key: ALERT_EMAIL_FROM
        sync: false
      - key: DISPLAY_TZ
        value: Africa/Lagos
      # On by default (names must match the approved templates; see README)
      - key: WHATSAPP_TEMPLATE_ACK
        value: meganet_inquiry_ack
      - key: WHATSAPP_TEMPLATE_ESCALATION
        value: meganet_lead_alert

databases:
  - name: meganet-sentinel-db
    plan: basic-256mb
